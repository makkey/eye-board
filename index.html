<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101418" />
    <title>EyeBoard</title>
  </head>
  <body>
    <!-- 文言は data-i18n 系の属性で src/i18n.ts から差し込む（言語の切り替えで入れ替わる） -->
    <header class="topbar">
      <h1>EyeBoard</h1>
      <span id="mode-badge" class="badge" hidden></span>
      <nav>
        <button id="btn-lang" type="button" data-i18n="nav.lang" data-i18n-aria="nav.langAria"></button>
        <button id="btn-calibrate" type="button" data-i18n="nav.calibrate"></button>
        <button id="btn-debug" type="button" aria-pressed="false" data-i18n="nav.debug"></button>
        <button id="btn-settings" type="button" data-i18n="nav.settings"></button>
      </nav>
    </header>

    <main class="app">
      <section class="output">
        <textarea id="text" readonly data-i18n-aria="text.aria" data-i18n-placeholder="text.placeholder"></textarea>
        <div class="output-actions">
          <button id="btn-speak" type="button" data-i18n="btn.speak"></button>
          <button id="btn-copy" type="button" data-i18n="btn.copy"></button>
          <button id="btn-undo" type="button" data-i18n="btn.undo"></button>
          <button id="btn-clear" type="button" data-i18n="btn.clear"></button>
        </div>
      </section>

      <section class="status">
        <div id="camera-preview" class="camera-preview" hidden><video id="video" playsinline muted></video></div>
        <div id="gaze" class="gaze" data-i18n-aria="gaze.aria"></div>
        <div class="status-text">
          <div id="status-main" class="status-main" data-i18n="status.ready"></div>
          <div id="status-sub" class="status-sub"></div>
          <div class="meter" aria-hidden="true"><div id="meter-fill"></div><div id="meter-long"></div></div>
        </div>
      </section>

      <section id="keyboard" class="keyboard" aria-live="polite"></section>

      <section id="debug" class="debug" hidden>
        <canvas id="debug-plot" width="360" height="360"></canvas>
        <div>
          <pre id="debug-text"></pre>
          <button id="btn-copy-cal" type="button" data-i18n="debug.copyCal"></button>
        </div>
      </section>

      <details class="help">
        <summary data-i18n="help.summary"></summary>
        <div data-i18n-html="help.body"></div>
      </details>
    </main>

    <div id="start" class="overlay">
      <div class="card">
        <h2>EyeBoard</h2>
        <p data-i18n-html="start.desc"></p>
        <div class="card-actions">
          <button id="btn-start-camera" type="button" class="primary" data-i18n="start.camera"></button>
          <button id="btn-start-sim" type="button" data-i18n="start.sim"></button>
          <button id="btn-start-lang" type="button" data-i18n="start.otherLang"></button>
        </div>
        <p id="start-error" class="error" role="alert"></p>
      </div>
    </div>

    <div id="calib" class="overlay" hidden>
      <div class="card calib-card">
        <div id="calib-arrow" class="calib-arrow">●</div>
        <div id="calib-text" class="calib-text"></div>
        <div class="meter"><div id="calib-fill"></div></div>
        <div id="calib-count" class="status-sub"></div>
        <button id="btn-calib-cancel" type="button" data-i18n="calib.stop"></button>
      </div>
    </div>

    <dialog id="settings">
      <form method="dialog">
        <h2 data-i18n="settings.title"></h2>
        <div id="settings-fields" class="settings-fields"></div>
        <div class="card-actions">
          <button id="btn-reset-settings" type="button" data-i18n="settings.reset"></button>
          <button id="btn-forget-cal" type="button" data-i18n="settings.forgetCal"></button>
          <button value="close" class="primary" data-i18n="settings.close"></button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
